    <script>
      // Suppress Vite HMR WebSocket connection errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (e.reason.message?.includes('WebSocket') ||
            e.reason.stack?.includes('createWebSocketModuleRunnerTransport') ||
            e.reason.stack?.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          e.message?.includes('WebSocket') ||
          e.message?.includes('createWebSocketModuleRunnerTransport') ||
          (typeof e.filename === 'string' && e.filename.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
